<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Luas Bangun Datar</title>
</head>
<body>

    <h1>Menghitung Luas Bangun Datar</h1>

    <script>
        // Fungsi untuk menghitung luas persegi panjang
        // Rumus: luas = panjang × lebar
        function luasPersegiPanjang(panjang, lebar) {
            let luas = panjang * lebar;
            return luas;
        }

        // Fungsi untuk menghitung luas bujur sangkar
        // Rumus: luas = sisi × sisi
        function luasBujurSangkar(sisi) {
            let luas = sisi * sisi;
            return luas;
        }

        // Fungsi untuk menghitung luas segitiga
        // Rumus: luas = 1/2 × alas × tinggi
        function luasSegitiga(alas, tinggi) {
            let luas = 0.5 * alas * tinggi;
            return luas;
        }



        let panjang = 10;
        let lebar = 5;
        let sisi = 6;
        let alas = 8;
        let tinggi = 6;


        let hasilPersegiPanjang = luasPersegiPanjang(panjang, lebar);
        let hasilBujurSangkar = luasBujurSangkar(sisi);
        let hasilSegitiga = luasSegitiga(alas, tinggi);

        document.write("<h2>Hasil Perhitungan</h2>");

        document.write(
            "<p>Luas Persegi Panjang = " +
            hasilPersegiPanjang +
            "</p>"
        );

        document.write(
            "<p>Luas Bujur Sangkar = " +
            hasilBujurSangkar +
            "</p>"
        );

        document.write(
            "<p>Luas Segitiga = " +
            hasilSegitiga +
            "</p>"
        );
    </script>

</body>
</html>
